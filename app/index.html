<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3b4c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="QCM néphrologie — révision adaptative (troubles hydro-électrolytiques)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Néphro QCM Coach</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" data-icon="logo" aria-hidden="true"></span>
        <div>
          <div class="brand-title">Néphro QCM Coach</div>
          <div class="brand-sub">Troubles hydro-électrolytiques &amp; acido-basique</div>
        </div>
      </div>
      <button type="button" class="btn ghost icon-btn menu-btn" id="btnNav" aria-label="Menu"><span data-icon="menu"></span></button>
    </header>

    <nav class="drawer" id="drawer" hidden>
      <button type="button" data-view="home"><span data-icon="home"></span> Accueil</button>
      <button type="button" data-view="train"><span data-icon="train"></span> Entraînement</button>
      <button type="button" data-view="exam"><span data-icon="exam"></span> Examen</button>
      <button type="button" data-view="lacunes"><span data-icon="lacunes"></span> Mes lacunes</button>
      <button type="button" data-view="forget"><span data-icon="forget"></span> Je n'oublie plus</button>
      <button type="button" data-view="errors"><span data-icon="errors"></span> Mes erreurs</button>
      <button type="button" data-view="favorites"><span data-icon="favorites"></span> Favoris</button>
      <button type="button" data-view="search"><span data-icon="search"></span> Recherche</button>
      <button type="button" data-view="history"><span data-icon="history"></span> Historique</button>
      <button type="button" data-view="courses"><span data-icon="courses"></span> Par cours</button>
      <button type="button" class="nav-danger" id="btnResetNav"><span data-icon="reset"></span> Reset progression</button>
    </nav>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigation rapide">
      <button type="button" data-view="home" class="bottom-nav-item"><span data-icon="home"></span><span>Accueil</span></button>
      <button type="button" data-view="train" class="bottom-nav-item"><span data-icon="train"></span><span>Train</span></button>
      <button type="button" data-view="lacunes" class="bottom-nav-item"><span data-icon="lacunes"></span><span>Lacunes</span></button>
      <button type="button" data-view="exam" class="bottom-nav-item"><span data-icon="exam"></span><span>Examen</span></button>
      <button type="button" class="bottom-nav-item" id="btnNavMore"><span data-icon="menu"></span><span>Plus</span></button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
